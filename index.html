<!DOCTYPE html>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #06090E; color: #E2E8F0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; padding-top: 80px; }
        .container { max-width: 1000px; margin: 0 auto; padding: 0 24px; }
        header { position: fixed; top: 0; left: 0; right: 0; height: 80px; background-color: rgba(6, 9, 14, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); z-index: 1000; }
        .header-wrap { display: flex; justify-content: space-between; align-items: center; height: 100%; }

        .badge { display: inline-block; padding: 5px 12px; background-color: rgba(59, 130, 246, 0.06); color: #60A5FA; border: 1px solid rgba(59, 130, 246, 0.15); border-radius: 50px; font-size: 11px; font-weight: 600; font-family: monospace; margin-bottom: 24px; }
        .hero h1 { font-size: 42px; font-weight: 800; color: #FFF; margin-bottom: 20px; }
        .hero p { font-size: 17px; color: #94A3B8; max-width: 650px; margin: 0 auto 36px auto; }
        .btn-primary { padding: 12px 24px; background-color: #3B82F6; color: #FFF; text-decoration: none; border-radius: 6px; }
        .grid-three { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 60px 0; }
        .card { background-color: #0F141C; padding: 28px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.03); }
        .contacts { padding: 60px 0; text-align: center; }
    </style>
