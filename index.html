<!DOCTYPE html>
<html lang="ru" style="scroll-behavior: smooth;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI & Enterprise Systems Architect | Максим Криштопа</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #06090E; 
            color: #E2E8F0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            padding-top: 80px;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
        
        /* Шапка */
        header {
            position: fixed; top: 0; left: 0; right: 0; height: 80px;
            background-color: rgba(6, 9, 14, 0.8);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-b: 1px solid rgba(255, 255, 255, 0.05); z-index: 1000;
        }
        .header-wrap { display: flex; justify-content: space-between; align-items: center; height: 100%; }
        .logo { font-size: 16px; font-weight: 700; letter-spacing: 2px; color: #FFF; text-decoration: none; font-family: monospace; }
        .logo span { color: #3B82F6; }
        .nav-links a { color: #94A3B8; text-decoration: none; font-size: 13px; font-weight: 500; margin-left: 32px; transition: color 0.2s; }
        .nav-links a:hover { color: #FFF; }
        .btn-nav { padding: 8px 16px; background-color: rgba(59, 130, 246, 0.1); color: #60A5FA !important; border: 1px solid rgba(59, 130, 246, 0.2); border-radius: 6px; }
        .btn-nav:hover { background-color: #3B82F6; color: #FFF !important; }

        /* Главный экран */
        .hero { padding: 120px 0 80px 0; text-align: center; }
        .badge { display: inline-block; padding: 6px 14px; background-color: rgba(59, 130, 246, 0.06); color: #60A5FA; border: 1px solid rgba(59, 130, 246, 0.15); border-radius: 50px; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; margin-bottom: 28px; font-family: monospace; }
        .hero h1 { font-size: 46px; font-weight: 800; color: #FFF; line-height: 1.2; margin-bottom: 24px; letter-spacing: -0.5px; }
        .hero h1 span { background: linear-gradient(90deg, #60A5FA, #9333EA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { font-size: 17px; color: #94A3B8; max-width: 700px; margin: 0 auto 44px auto; font-weight: 400; }
        .hero-btns { display: flex; justify-content: center; gap: 16px; }
        .btn-primary { padding: 14px 28px; background-color: #3B82F6; color: #FFF; text-decoration: none; font-size: 14px; font-weight: 500; border-radius: 8px; transition: background-color 0.2s; }
        .btn-primary:hover { background-color: #2563EB; }
        .btn-secondary { padding: 14px 28px; background-color: #111723; color: #E2E8F0; text-decoration: none; font-size: 14px; font-weight: 500; border-radius: 8px; border: 1px solid #1E293B; transition: all 0.2s; }
        .btn-secondary:hover { background-color: #1E293B; border-color: #475569; }

        /* Сетка карт */
        .grid-three { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; padding: 80px 0; border-top: 1px solid rgba(255, 255, 255, 0.05); }
        .card { background-color: #0F141C; padding: 36px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.03); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card:hover { transform: translateY(-4px); border-color: rgba(59, 130, 246, 0.2); background-color: #131A26; box-shadow: 0 12px 30px rgba(0,0,0,0.4); }
        .card-num { font-size: 12px; font-weight: 600; color: #3B82F6; font-family: monospace; margin-bottom: 16px; letter-spacing: 1px; }
        .card-title { font-size: 18px; font-weight: 700; color: #FFF; margin-bottom: 12px; }
        .card p { font-size: 14px; color: #94A3B8; line-height: 1.6; }

        /* Раздел вызовов */
        .problems-section { padding: 90px 0; background-color: #090D14; border-top: 1px solid rgba(255, 255, 255, 0.05); }
        .section-title { text-align: center; font-size: 26px; font-weight: 700; color: #FFF; margin-bottom: 12px; letter-spacing: -0.5px; }
        .section-subtitle { text-align: center; color: #64748B; font-size: 14px; margin-bottom: 48px; max-width: 500px; margin-left: auto; margin-right: auto; }
        .problem-row { display: flex; gap: 24px; background-color: #0F141C; padding: 28px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.02); margin-bottom: 16px; transition: border-color 0.2s; }
        .problem-row:hover { border-color: rgba(239, 68, 68, 0.15); }
        .problem-tag { font-family: monospace; font-weight: 700; color: #EF4444; font-size: 14px; }
        .problem-text h4 { color: #FFF; margin-bottom: 6px; font-size: 16px; font-weight: 600; }
        .problem-text p { color: #94A3B8; font-size: 14px; line-height: 1.5; }

        /* Контакты */
        .contacts { padding: 90px 0; text-align: center; border-top: 1px solid rgba(255, 255, 255, 0.05); }
        .contact-box { display: inline-flex; gap: 48px; background-color: #0F141C; padding: 28px 48px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.03); margin-top: 40px; text-align: left; }
        .contact-item span { display: block; font-size: 11px; color: #475569; text-transform: uppercase; font-weight: 600; margin-bottom: 6px; letter-spacing: 0.5px; }
        .contact-item a { color: #60A5FA; text-decoration: none; font-weight: 600; font-family: monospace; font-size: 15px; transition: color 0.2s; }
        .contact-item a:hover { color: #3B82F6; }
        footer { margin-top: 80px; font-size: 12px; color: #334155; font-family: monospace; }

        @media (max-width: 768px) {
            .hero h1 { font-size: 32px; }
            .nav-links { display: none; }
            .contact-box { flex-direction: column; gap: 24px; padding: 28px; text-align: center; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-wrap">
            <a href="#" class="logo">RICHEST<span>MAX</span>.RU</a>
            <nav class="nav-links">
                <a href="#about">Экспертиза</a>
                <a href="#problems">Вызовы</a>
                <a href="#contact" class="btn-nav">Аудит</a>
            </nav>
        </div>
    </header>
